<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Warden: Towards Practical Generative Speech Watermarking via Parameter-Efficient Injection. Compare original and watermarked DiffWave and HiFi-GAN speech." />
  <title>Warden · Generative Watermarking</title>
  <link rel="stylesheet" href="./styles-minimal.css?v=20261019" />
  <script src="./app.js?v=20261019" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header"><a class="brand" href="#top">Warden <small>Watermarked Speech demo</small></a></header>
    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <div class="hero-brand"><span>Warden</span></div>
          <h1 id="page-title">Towards Practical Generative Speech Watermarking via Parameter-Efficient Injection</h1>
        </div>
      </section>
      <section id="samples" class="listening-section" aria-labelledby="samples-title">
        <div class="section-heading"><p class="eyebrow">NEURAL VOCODER · SPEECH SAMPLES</p><h2 id="samples-title">Experimental examples</h2></div>
        <div class="control-panel">
          <div class="control-block">
            <span class="control-label">Speech model</span>
            <div class="segmented" role="group" aria-label="Speech model">
              <button type="button" data-model="diffwave" aria-pressed="true"><span class="model-name">DiffWave</span><span class="model-description">Diffusion-based neural vocoder</span></button>
              <button type="button" data-model="hifigan" aria-pressed="false"><span class="model-name">HiFi-GAN</span><span class="model-description">GAN-based neural vocoder</span></button>
            </div>
          </div>
          <div class="control-block prompt-block">
            <span class="control-label">Evaluation sample</span>
            <div class="prompt-tabs" role="group" aria-label="Evaluation sample">
              <button type="button" data-sample="1" aria-pressed="true">Sample 01</button>
              <button type="button" data-sample="2" aria-pressed="false">Sample 02</button>
              <button type="button" data-sample="3" aria-pressed="false">Sample 03</button>
              <button type="button" data-sample="4" aria-pressed="false">Sample 04</button>
              <button type="button" data-sample="5" aria-pressed="false">Sample 05</button>
            </div>
          </div>
        </div>
        <div class="selection-banner" aria-live="polite" aria-atomic="true"><div><span class="selection-overline" id="selection-label"></span><p id="selection-title"></p></div></div>
        <div id="audio-layout" class="audio-layout"></div>
        <noscript><p>Enable JavaScript to switch samples. <a href="./DiffWave/DiffWave_audio1.wav">Listen to the first original DiffWave sample</a>.</p></noscript>
      </section>
    </main>
    <footer class="demo-footer"><span>Warden speech samples</span><a href="#top">Back to top ↑</a></footer>
  </div>
</body>
</html>
